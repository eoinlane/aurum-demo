<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240"
     role="img" aria-label="Tri-state mechanics: Liquidity, Solvency, Prosperity with flow arrows between them">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Flow arrows (drawn first so they sit behind the nodes) -->

  <!-- L ↔ S (left diagonal) -->
  <line x1="208" y1="62" x2="132" y2="172" stroke="#94a3b8" stroke-width="1.5"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="120" y="120" text-anchor="end" font-family="Inter,sans-serif" font-size="10" fill="#475569">Commit · Redeem</text>

  <!-- L ↔ P (right diagonal) -->
  <line x1="272" y1="62" x2="348" y2="172" stroke="#94a3b8" stroke-width="1.5"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="360" y="120" text-anchor="start" font-family="Inter,sans-serif" font-size="10" fill="#475569">Purchase · Liquidate</text>

  <!-- S ↔ P (bottom horizontal) -->
  <line x1="142" y1="200" x2="338" y2="200" stroke="#94a3b8" stroke-width="1.5"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="240" y="222" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#475569">Capitalize · Collateralize</text>

  <!-- Nodes -->
  <g font-family="Inter,sans-serif" text-anchor="middle">
    <!-- Liquidity (apex) -->
    <circle cx="240" cy="40" r="38" fill="#60a5fa"/>
    <text x="240" y="44" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">LIQUIDITY</text>

    <!-- Solvency (bottom-left) -->
    <circle cx="100" cy="200" r="38" fill="#34d399"/>
    <text x="100" y="204" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">SOLVENCY</text>

    <!-- Prosperity (bottom-right) -->
    <circle cx="380" cy="200" r="38" fill="#c084fc"/>
    <text x="380" y="204" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">PROSPERITY</text>
  </g>
</svg>
